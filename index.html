    <script>
        $(document).ready(function() {
            var pages = [
                { id: '#home', url: 'pages/home.html' },
                { id: '#about', url: 'pages/about.html' },
                { id: '#work', url: 'pages/work.html' },
                { id: '#portfolio', url: 'pages/portfolio.html' },
                { id: '#contact', url: 'pages/contact.html' }
            ];

            var loadedCount = 0;
            pages.forEach(function(page) {
                $(page.id).load(page.url, function(response, status, xhr) {
                    if (status === "error") {
                        console.error("Failed to load page: " + page.url);
                    }
                    loadedCount++;
                    if (loadedCount === pages.length) {
                        if (typeof renderWorkTimeline === "function") {
                            renderWorkTimeline();
                        }
                        if (typeof renderPortfolioGrid === "function") {
                            renderPortfolioGrid();
                        }
                        if (typeof initializePortfolio === "function") {
                            initializePortfolio();
                        }
                        if (typeof updateGlobalStats === "function") {
                            updateGlobalStats();
                        }
                        if (typeof window.initHeadline === "function") {
                            window.initHeadline();
                        }
                    }
                });
            });
        });
    </script>
